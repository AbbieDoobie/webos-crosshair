<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Crosshair Dot</title>
<style>
    /* The page must stay transparent: webOS draws the input underneath this window. */
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
    }
    svg {
        position: absolute;
        left: 0;
        top: 0;
    }
</style>
</head>
<body>
<!-- Web apps render at 1920x1080 and the TV scales them to the panel. -->
<svg id="crosshair" width="1920" height="1080" viewBox="0 0 1920 1080"
     xmlns="http://www.w3.org/2000/svg"></svg>
<script src="luna.js"></script>
<script src="render.js"></script>
<script src="crosshair.js"></script>
</body>
</html>
